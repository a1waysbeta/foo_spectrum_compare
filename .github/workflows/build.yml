name: Build foobar2000 Spectrum Compare Component

# Manual-only build (Actions page -> Run workflow). Users want explicit
# control over when binaries are produced, not auto-trigger on every push.
on:
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
# =============================================================================
# 1. Build Win32 (x86) + x64  (matrix)
# =============================================================================
  build-multi-platform:
    # Pin to windows-2022: ships VS 2022 Enterprise with ATL (atlbase.h)
    # pre-installed. Do NOT use windows-latest — newer images may resolve a
    # VS preview that lacks ATL headers.
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x86, x64]
        include:
          - platform: x86
            msbuild_platform: Win32
            # x86 DLL goes at the ROOT of the .fb2k-component archive.
            component_rel_dir: .
          - platform: x64
            msbuild_platform: x64
            # x64 DLL goes in a top-level x64\ subdirectory.
            component_rel_dir: x64
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Download WTL 10.0.10320 headers
      # foobar2000 SDK helpers pull in WTL through atlapp.h. Copy the Include
      # folder under C:\WTL\Include and expose it to ALL cl.exe invocations
      # through the CL env var (matches the project memory hard constraint).
      shell: pwsh
      run: |
        $url = "https://raw.githubusercontent.com/Win32-WTL/WTL/main/Releases/WTL10_10320_Final.zip"
        $zip = "$env:TEMP\WTL10_10320_Final.zip"
        $dest = "C:\WTL10"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dest -Force
        $includePath = Get-ChildItem -Path $dest -Recurse -Directory -Filter "Include" | Select-Object -First 1 -ExpandProperty FullName
        if (-not $includePath -or -not (Test-Path "$includePath\atlapp.h")) {
          Write-Host "::error::WTL 10 atlapp.h not found under $dest"
          exit 1
        }
        Write-Host "WTL 10 headers available at $includePath"
        echo "CL=/I`"$includePath`"" >> $env:GITHUB_ENV

    - name: Restore NuGet packages (if any)
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      shell: pwsh
      run: nuget restore "${{ env.SOLUTION_FILE_PATH }}" 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "NuGet restore skipped or failed (may be normal on fresh checkouts)" }

    - name: Build ${{ matrix.platform }} (msbuild ${{ matrix.msbuild_platform }})
      working-directory: ${{ env.GITHUB_WORKSPACE }}
      # /p:PlatformToolset=v143 forces the VS 2022 toolset for every project in
      # the solution (the bundled SDK sub-projects default to v142 which is
      # absent on windows-2022 runners).
      shell: pwsh
      run: |
        msbuild /m `
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} `
          /p:Platform=${{ matrix.msbuild_platform }} `
          /p:PlatformToolset=v143 `
          "${{ env.SOLUTION_FILE_PATH }}"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Locate built DLL (${{ matrix.platform }})
      id: locate
      shell: pwsh
      run: |
        $msbuild_platform = "${{ matrix.msbuild_platform }}"
        if ($msbuild_platform -eq "x64") {
          $dllPath = "x64\${{ env.BUILD_CONFIGURATION }}\foo_spectrum_compare.dll"
        } else {
          $dllPath = "${{ env.BUILD_CONFIGURATION }}\foo_spectrum_compare.dll"
        }
        if (-not (Test-Path $dllPath)) {
          Write-Host "DLL not found at $dllPath, searching recursively..."
          $found = Get-ChildItem -Recurse -Filter "foo_spectrum_compare.dll" | Select-Object -First 1
          if ($found) { $dllPath = $found.FullName } else {
            Write-Host "::error::foo_spectrum_compare.dll not built"
            exit 1
          }
        }
        Write-Host "Using DLL: $dllPath"
        "dll_path=$dllPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    # Stage the DLL into the layout the .fb2k-component archive expects. The
    # package job later downloads these staged artifacts and zips them up.
    - name: Stage DLL for packaging
      shell: pwsh
      run: |
        $dllPath = "${{ steps.locate.outputs.dll_path }}"
        $stageRoot = Join-Path $env:GITHUB_WORKSPACE "_component_stage"
        $destDir = Join-Path $stageRoot "${{ matrix.component_rel_dir }}"
        New-Item -ItemType Directory -Force -Path $destDir | Out-Null
        Copy-Item $dllPath (Join-Path $destDir "foo_spectrum_compare.dll") -Force
        Write-Host "Staged:"
        Get-ChildItem -Recurse $stageRoot | ForEach-Object { $_.FullName }

    - name: Upload staged DLL (${{ matrix.platform }})
      uses: actions/upload-artifact@v7
      with:
        name: foo_spectrum_compare_${{ matrix.platform }}
        path: _component_stage/**/*
        if-no-files-found: error

# =============================================================================
# 2. Package → ONE .fb2k-component (zip with renamed extension)
# =============================================================================
  package:
    runs-on: windows-2022
    needs: build-multi-platform
    name: Package fb2k-component

    permissions:
      contents: write   # required if we later push a tagged release

    steps:
    # x86 archive is the root of the final layout (component_temp\foo_*.dll).
    - name: Download x86 staged DLL
      uses: actions/download-artifact@v8
      with:
        name: foo_spectrum_compare_x86
        path: component_temp

    # x64 archive contains _component_stage\x64\foo_*.dll which maps to
    # component_temp\x64\foo_*.dll (matches the requested layout exactly).
    - name: Download x64 staged DLL
      uses: actions/download-artifact@v8
      with:
        name: foo_spectrum_compare_x64
        path: component_temp

    - name: Verify component layout
      shell: cmd
      run: |
        echo ===== expected structure =====
        echo   foo_spectrum_compare.dll
        echo   x64\foo_spectrum_compare.dll
        echo ===== actual structure =====
        dir component_temp /s /b

    - name: Create foo_spectrum_compare.fb2k-component
      shell: powershell
      run: |
        $zipPath = "foo_spectrum_compare.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
        Compress-Archive `
          -Path "component_temp\*" `
          -DestinationPath $zipPath `
          -CompressionLevel Optimal
        Rename-Item -Path $zipPath -NewName "foo_spectrum_compare.fb2k-component" -Force
        Get-ChildItem foo_spectrum_compare.fb2k-component | Select-Object Name, Length

    - name: Upload final component artifact
      uses: actions/upload-artifact@v7
      with:
        name: foo_spectrum_compare_component
        path: foo_spectrum_compare.fb2k-component
        if-no-files-found: error

    # Keep the existing tag-release behaviour so `git tag vX.Y.Z && push`
    # (then run the workflow manually or via push-trigger removed above) can
    # still attach the built .fb2k-component to a GitHub Release.
    - name: Publish tagged release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        files: foo_spectrum_compare.fb2k-component
