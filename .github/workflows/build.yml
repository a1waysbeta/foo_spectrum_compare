name: Build foobar2000 Spectrum Compare Component

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    # Pin to windows-2022: ships VS 2022 Enterprise with ATL (atlbase.h) pre-installed.
    # Do NOT use windows-latest — newer images may resolve a VS preview lacking ATL.
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x64, Win32]
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Download WTL headers
      # WTL (atlapp.h / atlcrack.h / atlctrls.h) is NOT shipped with Visual Studio.
      # The foobar2000 SDK helpers include <atlapp.h> via foobar2000-lite+atl.h.
      # We clone the official WTL mirror and expose it to ALL cl.exe invocations
      # through the CL environment variable (prepended to every compile).
      shell: pwsh
      run: |
        git clone --depth 1 https://github.com/Win32-WTL/WTL.git C:\WTL
        if (-not (Test-Path "C:\WTL\Include\atlapp.h")) {
          Write-Host "::error::WTL atlapp.h not found at C:\WTL\Include"
          exit 1
        }
        Write-Host "WTL headers available at C:\WTL\Include"
        echo "CL=/I`"C:\WTL\Include`"" >> $env:GITHUB_ENV

    - name: Restore NuGet packages (if any)
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}} 2>$null; if ($LASTEXITCODE -ne 0) { Write-Host "NuGet restore skipped or failed (may be normal)" }

    - name: Build ${{ matrix.platform }}
      working-directory: ${{env.GITHUB_WORKSPACE}}
      # /p:PlatformToolset=v143 forces the VS 2022 toolset for every project in the
      # solution (the SDK sub-projects default to v142 which may be absent on the runner).
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v143 ${{env.SOLUTION_FILE_PATH}}
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Locate built DLL
      id: locate
      shell: pwsh
      run: |
        $platform = "${{ matrix.platform }}"
        if ($platform -eq "x64") {
          $dllPath = "x64\Release\foo_spectrum_compare.dll"
        } else {
          $dllPath = "Release\foo_spectrum_compare.dll"
        }
        if (Test-Path $dllPath) {
          Write-Host "Found: $dllPath"
          "dll_path=$dllPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        } else {
          Write-Host "DLL not found at $dllPath, searching..."
          $found = Get-ChildItem -Recurse -Filter "foo_spectrum_compare.dll" | Select-Object -First 1
          if ($found) {
            Write-Host "Found at: $($found.FullName)"
            "dll_path=$($found.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "::error::DLL not found"
            exit 1
          }
        }

    - name: Rename to .fb2k-component
      shell: pwsh
      id: rename
      run: |
        $dllPath = "${{ steps.locate.outputs.dll_path }}"
        $platform = "${{ matrix.platform }}"
        $componentName = "foo_spectrum_compare-${platform}.fb2k-component"
        Copy-Item $dllPath $componentName
        Write-Host "Created: $componentName"
        "component_name=$componentName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: foo_spectrum_compare-${{ matrix.platform }}
        path: ${{ steps.rename.outputs.component_name }}
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
    - name: List artifacts
      run: ls -R artifacts
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        files: |
          artifacts/**/*.fb2k-component
