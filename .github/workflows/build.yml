name: Build foobar2000 Spectrum Compare Component

# Manual-only build (Actions page -> Run workflow). Users want explicit
# control over when binaries are produced, not auto-trigger on every push.
on:
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
# =============================================================================
# 1. Build Win32 (x86) + x64  (matrix)
# =============================================================================
  build-multi-platform:
    # Pin to windows-2022: ships VS 2022 Enterprise with ATL (atlbase.h)
    # pre-installed. Do NOT use windows-latest — newer images may resolve a
    # VS preview that lacks ATL headers.
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x86, x64]
        include:
          - platform: x86
            msbuild_platform: Win32
            outdir_platform: x86
          - platform: x64
            msbuild_platform: x64
            outdir_platform: x64
      fail-fast: false

    steps:
    # -------------------------------------------------------------------------
    # 1. Checkout Repositories (all fetch-depth: 1 for shallow clone)
    # -------------------------------------------------------------------------
    - name: Checkout foo_spectrum_compare
      uses: actions/checkout@v6
      with:
        path: foo_spectrum_compare
        fetch-depth: 1

    - name: Checkout Foobar2000 SDK
      uses: actions/checkout@v6
      with:
        repository: reupen/foobar2000-sdk-modified
        ref: f56be547d34468da2ff47fcf49eacee41b6f42b1
        path: foo_spectrum_compare/lib/columns_ui/foobar2000
        fetch-depth: 1

    - name: Checkout PFC
      uses: actions/checkout@v6
      with:
        repository: reupen/pfc-modified
        ref: 75053edf649b41b2202fcc7b9c5c3848a0e9a8cb
        path: foo_spectrum_compare/lib/columns_ui/pfc
        fetch-depth: 1

    # libPPUI: spectrum_window.cpp uses WIN32_OP from libPPUI/win32_op.h.
    # reupen/foobar2000-sdk-modified does not include libPPUI, so it is
    # extracted from the official foobar2000 SDK archive (pinned 2026-10-01,
    # the same SDK version the reupen forks are based on).
    - name: Download official SDK and extract libPPUI
      shell: pwsh
      run: |
        $sdkUrl = "https://www.foobar2000.org/downloads/SDK-2026-10-01.7z"
        $zip = "$env:TEMP\fb2k_sdk.7z"
        Invoke-WebRequest -Uri $sdkUrl -OutFile $zip
        7z x $zip -o"$env:TEMP\fb2k_sdk" | Out-Null
        if (-not (Test-Path "$env:TEMP\fb2k_sdk\libPPUI\libPPUI.vcxproj")) {
          Write-Host "::error::libPPUI not found in official SDK archive"
          exit 1
        }
        Move-Item "$env:TEMP\fb2k_sdk\libPPUI" "foo_spectrum_compare\lib\columns_ui\libPPUI"

    # columns_ui-sdk: required for the CUI (Columns UI) panel adapter
    # (spectrum_window_cui.cpp implements uie::window).  Pinned to the
    # same commit used by Columns UI v3.7.0 (matches foo_modernplaylist
    # and foo_nowbar build workflows).
    - name: Checkout Columns UI SDK
      uses: actions/checkout@v6
      with:
        repository: reupen/columns_ui-sdk
        ref: 69972e36febc4bfc2685fa1a7620d0ee8789e10f
        path: foo_spectrum_compare/lib/columns_ui/columns_ui-sdk
        fetch-depth: 1

    # -------------------------------------------------------------------------
    # 2. Build Environment Setup
    # -------------------------------------------------------------------------
    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v3

    - name: Download WTL 10.0.10320 headers
      # foobar2000 SDK helpers pull in WTL through atlapp.h (needed because
      # this component uses input_helper from the helpers library). Copy the
      # Include folder under C:\WTL\Include and expose it to ALL cl.exe
      # invocations through the CL env var.
      shell: pwsh
      run: |
        $url = "https://raw.githubusercontent.com/Win32-WTL/WTL/main/Releases/WTL10_10320_Final.zip"
        $zip = "$env:TEMP\WTL10_10320_Final.zip"
        $dest = "C:\WTL10"
        Invoke-WebRequest -Uri $url -OutFile $zip
        Expand-Archive -Path $zip -DestinationPath $dest -Force
        $includePath = Get-ChildItem -Path $dest -Recurse -Directory -Filter "Include" | Select-Object -First 1 -ExpandProperty FullName
        if (-not $includePath -or -not (Test-Path "$includePath\atlapp.h")) {
          Write-Host "::error::WTL 10 atlapp.h not found under $dest"
          exit 1
        }
        Write-Host "WTL 10 headers available at $includePath"
        echo "CL=/I`"$includePath`"" >> $env:GITHUB_ENV

    - name: Fix Platform Toolset and RuntimeLibrary for GitHub Actions
      # The remote SDK sub-projects may default to v140/v141 which are absent
      # on windows-2022 runners. Patch every vcxproj under lib/ to use v143.
      # Also force /MT (MultiThreaded) instead of /MD (MultiThreadedDLL) so all
      # dependency libs match the component's RuntimeLibrary setting. msbuild
      # /p:RuntimeLibrary=MultiThreaded on the command line does NOT override
      # <RuntimeLibrary> tags inside <ItemDefinitionGroup> in the vcxproj,
      # so the file itself must be patched.
      shell: pwsh
      run: |
        Get-ChildItem -Path foo_spectrum_compare -Recurse -Filter *.vcxproj | ForEach-Object {
          $content = Get-Content $_.FullName -Raw
          $changed = $false
          if ($content -match 'v14[05]') {
            Write-Host "Fixing toolset: $($_.Name)"
            $content = $content -replace 'v14[05]', 'v143'
            $changed = $true
          }
          if ($content -match 'MultiThreadedDLL') {
            Write-Host "Fixing RuntimeLibrary MD->MT: $($_.Name)"
            $content = $content -replace 'MultiThreadedDebugDLL', 'MultiThreadedDebug'
            $content = $content -replace 'MultiThreadedDLL', 'MultiThreaded'
            $changed = $true
          }
          if ($changed) {
            Set-Content $_.FullName -Value $content -NoNewline
          }
        }

    - name: Stub DarkMode.cpp in SDK helpers
      # The foobar2000 SDK helpers' DarkMode.h references APIs from a newer
      # libPPUI than what is available in the pinned SDK version, causing
      # ~25 compilation errors.  Our component (and the columns_ui-sdk) does
      # not use DarkMode at all, so replacing DarkMode.cpp with a minimal
      # stub (just the precompiled header include) is safe: no unresolved
      # symbols because nothing references DarkMode functions.
      shell: pwsh
      run: |
        $darkMode = "foo_spectrum_compare\lib\columns_ui\foobar2000\helpers\DarkMode.cpp"
        if (Test-Path $darkMode) {
          Set-Content $darkMode -Value '#include "StdAfx.h"' -NoNewline
          Write-Host "Stubbed DarkMode.cpp"
        } else {
          Write-Host "DarkMode.cpp not found, skipping stub"
        }

    # -------------------------------------------------------------------------
    # 3. Build Dependencies (in dependency order)
    # -------------------------------------------------------------------------
    - name: Build PFC (${{ matrix.platform }})
      shell: cmd
      run: |
        msbuild foo_spectrum_compare\lib\columns_ui\pfc\pfc.vcxproj ^
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=${{ matrix.outdir_platform }}\pfc\

    - name: Build Foobar2000 SDK (${{ matrix.platform }})
      shell: cmd
      run: |
        msbuild foo_spectrum_compare\lib\columns_ui\foobar2000\SDK\foobar2000_SDK.vcxproj ^
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=${{ matrix.outdir_platform }}\foobar2000_SDK\

    - name: Build Foobar2000 SDK Helpers (${{ matrix.platform }})
      # Required: spectrum_window.cpp uses input_helper from the helpers library.
      # Also requires WTL headers (atlapp.h) made available via the CL env var.
      shell: cmd
      run: |
        msbuild foo_spectrum_compare\lib\columns_ui\foobar2000\helpers\foobar2000_sdk_helpers.vcxproj ^
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=${{ matrix.outdir_platform }}\helpers\

    - name: Build libPPUI (${{ matrix.platform }})
      # Required: spectrum_window.cpp uses WIN32_OP from libPPUI.
      # Use Configuration=Release-Static (not Release): the official SDK
      # libPPUI.vcxproj's Release config has NO <RuntimeLibrary> tag and
      # inherits /MD by default; only Release-Static explicitly sets
      # <RuntimeLibrary>MultiThreaded</RuntimeLibrary> (/MT) to match the
      # component and other deps.
      shell: cmd
      run: |
        msbuild foo_spectrum_compare\lib\columns_ui\libPPUI\libPPUI.vcxproj ^
          /p:Configuration=Release-Static ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=${{ matrix.outdir_platform }}\libPPUI\

    - name: Build Columns UI SDK (${{ matrix.platform }})
      # Required: spectrum_window_cui.cpp implements uie::window (CUI panel)
      # using the columns_ui-sdk headers and lib.  The columns_ui-sdk.vcxproj
      # Release config already has RuntimeLibrary=MultiThreaded (/MT).
      shell: cmd
      run: |
        msbuild foo_spectrum_compare\lib\columns_ui\columns_ui-sdk\columns_ui-sdk.vcxproj ^
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=${{ matrix.outdir_platform }}\columns_ui_sdk\

    # -------------------------------------------------------------------------
    # 4. Build Component
    # -------------------------------------------------------------------------
    - name: Build foo_spectrum_compare (${{ matrix.platform }})
      shell: cmd
      run: |
        msbuild foo_spectrum_compare\foo_spectrum_compare.vcxproj ^
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} ^
          /p:Platform=${{ matrix.msbuild_platform }} ^
          /p:OutDir=..\bin\${{ matrix.outdir_platform }}\

    - name: Upload DLL (${{ matrix.platform }})
      uses: actions/upload-artifact@v7
      with:
        name: foo_spectrum_compare_${{ matrix.platform }}
        path: bin/${{ matrix.outdir_platform }}/foo_spectrum_compare.dll
        if-no-files-found: error

# =============================================================================
# 2. Package → ONE .fb2k-component (zip with renamed extension)
# =============================================================================
  package:
    runs-on: windows-2022
    needs: build-multi-platform
    name: Package fb2k-component

    permissions:
      contents: write   # required for tagged release publishing

    steps:
    # x86 DLL goes at the ROOT of the component archive.
    - name: Download x86 DLL
      uses: actions/download-artifact@v8
      with:
        name: foo_spectrum_compare_x86
        path: component_temp

    # x64 DLL goes in a top-level x64\ subdirectory.
    - name: Download x64 DLL
      uses: actions/download-artifact@v8
      with:
        name: foo_spectrum_compare_x64
        path: component_temp\x64

    - name: Verify component layout
      shell: cmd
      run: |
        echo ===== expected structure =====
        echo   foo_spectrum_compare.dll
        echo   x64\foo_spectrum_compare.dll
        echo ===== actual structure =====
        dir component_temp /s /b

    - name: Create foo_spectrum_compare.fb2k-component
      shell: powershell
      run: |
        $zipPath = "foo_spectrum_compare.zip"
        if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
        Compress-Archive `
          -Path "component_temp\*" `
          -DestinationPath $zipPath `
          -CompressionLevel Optimal
        Rename-Item -Path $zipPath -NewName "foo_spectrum_compare.fb2k-component" -Force
        Get-ChildItem foo_spectrum_compare.fb2k-component | Select-Object Name, Length

    - name: Upload final component artifact
      uses: actions/upload-artifact@v7
      with:
        name: foo_spectrum_compare_component
        path: foo_spectrum_compare.fb2k-component
        if-no-files-found: error

    - name: Publish tagged release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        generate_release_notes: true
        files: foo_spectrum_compare.fb2k-component
